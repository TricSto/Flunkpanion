name: CI

# Baut die App bei jedem Push/PR – fängt Typ- und Build-Fehler ab, bevor
# Vercel deployt.
# Hinweis: Produktions-/Default-Branch dieses Repos ist derzeit
# `claude/flunk-des-lebens-app-iprjtq`. Falls ihr ihn später zu `main`
# umbenennt, ist `main` bereits mit aufgeführt.
on:
  push:
    branches:
      - main
      - claude/flunk-des-lebens-app-iprjtq
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
