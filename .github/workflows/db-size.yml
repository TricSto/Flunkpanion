name: DB-Speicher prüfen

# Diagnose-Workflow: fragt über die Supabase-Management-API die aktuelle
# Datenbankgröße ab und listet die größten Tabellen. Manuell startbar,
# das Ergebnis steht im Job-Log.
on:
  workflow_dispatch:

permissions: {}

env:
  SUPABASE_PROJECT_ID: jkqkcuuogymfbdirdmde

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbankgröße abfragen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() {
            curl -sf -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg query "$1" '{query: $query}')"
          }
          echo "== Gesamtgröße der Datenbank =="
          q "select pg_size_pretty(pg_database_size(current_database())) as gesamt,
                    pg_database_size(current_database()) as bytes" | jq .
          echo "== Größte Relationen (inkl. Indexe/TOAST) =="
          q "select n.nspname as schema, c.relname as name,
                    pg_size_pretty(pg_total_relation_size(c.oid)) as groesse
             from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where c.relkind in ('r','m')
             order by pg_total_relation_size(c.oid) desc limit 15" | jq .
          echo "== Tabelle games =="
          q "select count(*) as spiele,
                    pg_size_pretty(pg_total_relation_size('public.games')) as gesamtgroesse,
                    pg_size_pretty(coalesce(sum(pg_column_size(t.*)),0)::bigint) as zeilendaten
             from public.games t" | jq .
